syntax = "proto3";

package intervention.v1;

import "google/protobuf/timestamp.proto";

// Signed intervention command emitted by intervention-planner in the cloud tier
// and verified by safety-guard on the edge tier before actuation.
//
// Safety invariants:
//   - Command MUST be signed (Ed25519).
//   - Edge MUST reject expired commands.
//   - Edge MUST reject commands exceeding the local current-density / charge envelope,
//     regardless of signature validity.
message Command {
  // Globally unique command identifier (UUID v7).
  string command_id = 1;

  // Timestamp when the command was issued by the cloud.
  google.protobuf.Timestamp issued_at = 2;

  // Stimulation parameters proposed by the RL policy engine.
  message StimParams {
    // Target current in milliamperes. MUST be within device safety limits.
    float current_ma = 1;

    // Pulse duration in milliseconds.
    float duration_ms = 2;

    // Electrode montage identifier (e.g., "F3-F4", "C3-C4").
    // MUST reference a montage pre-approved in the device safety envelope.
    string montage = 3;

    // Stimulation frequency in Hz.
    float freq_hz = 4;

    // Total charge per pulse (µC), computed as current_ma * duration_ms.
    // Provided explicitly so the safety-guard can verify without recomputing.
    float charge_uc = 5;
  }
  StimParams stimulation = 3;

  // Human-readable rationale generated by jsl-gemma.
  // Cites evidence markers and explains the clinical reasoning chain.
  string rationale = 4;

  // Composite risk score [0, 100] that triggered this intervention.
  // Derived from htsf-attention + ai-biomarker + risk-scoring pipeline.
  float risk_score = 5;

  // Ed25519 signature over the serialized StimParams + risk_score.
  // Signed by the cloud intervention-planner's private key.
  bytes signature = 6;

  // Command expiry timestamp.
  // The edge safety-guard MUST reject any command received after this time.
  google.protobuf.Timestamp expires_at = 7;

  // Session identifier linking this command to a specific acquisition session.
  string session_id = 8;
}
