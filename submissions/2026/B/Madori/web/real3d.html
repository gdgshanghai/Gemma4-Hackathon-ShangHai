<!doctype html>
<html lang="zh"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>真实建筑 → 白模 · Madori</title>
<style>
  :root{--paper:#efe9df;--ink:#2b2823;--soft:#6b655c;--card:rgba(250,247,241,.8);--line:rgba(70,64,56,.14);
    --serif:"Songti SC",Georgia,serif;--mono:"SF Mono",ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
  #app{position:fixed;inset:0}canvas{display:block}
  .title{position:fixed;top:24px;left:26px;z-index:10;pointer-events:none}
  .title h1{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);margin:0}
  .title .s{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);margin-top:4px}
  .attr{position:fixed;right:14px;bottom:12px;z-index:10;font-family:var(--mono);font-size:10px;color:var(--soft);
    background:rgba(250,247,241,.7);padding:3px 8px;border-radius:5px;max-width:50vw;text-align:right}
  .status{position:fixed;left:26px;bottom:24px;z-index:10;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:13px 16px;backdrop-filter:blur(12px);font-family:var(--mono);font-size:11px;color:var(--ink);max-width:340px;line-height:1.6}
  .status b{color:#b34a26}
  .hint{position:fixed;right:18px;top:24px;z-index:10;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--soft);opacity:.75}
</style></head>
<body>
<div id="app"></div>
<div class="title"><h1>真实建筑 → 白模</h1><div class="s" id="src">real-building white massing</div></div>
<div class="status" id="status">加载中…</div>
<div class="attr" id="attr"></div>
<div class="hint">拖拽旋转 · 滚轮缩放</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
    "3d-tiles-renderer": "https://esm.sh/3d-tiles-renderer@0.3.38?external=three"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const statusEl = document.getElementById('status');
const setStatus = (h) => { statusEl.innerHTML = h; };

// ---- config: source = 'plateau' (local glTF/3D Tiles) | 'google' (API key) ----
const params = new URLSearchParams(location.search);
const SOURCE = params.get('source') || 'plateau';
const TILESET = params.get('tileset') || '';            // explicit tileset url (overrides)
const GKEY    = params.get('key') || '';                // google api key
const LAT = parseFloat(params.get('lat')) , LNG = parseFloat(params.get('lng'));

document.getElementById('src').textContent = `source: ${SOURCE}`;

// ---- scene / renderer / lights (light studio, matches massing aesthetic) ----
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefe9df);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 40000);
camera.position.set(150,140,180);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .07;
scene.add(new THREE.HemisphereLight(0xffffff,0xddd5c6,.7));
const key = new THREE.DirectionalLight(0xfff4e6,1.05); key.position.set(120,200,90); scene.add(key);
const fill = new THREE.DirectionalLight(0xeaf0ff,.28); fill.position.set(-120,90,-90); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff,.2));

// ---- shared: white-material override on every loaded tile mesh ----
const whiteMat = () => new THREE.MeshStandardMaterial({ color:0xf3efe8, roughness:1, metalness:0, map:null });
function whitenModel(scene3d){
  scene3d.traverse(c => {
    if (c.isMesh){ c.userData._orig = c.material; c.material = whiteMat(); c.castShadow = c.receiveShadow = true; }
  });
}

// ---- load tiles (both sources converge on 3d-tiles-renderer) ----
async function loadTiles(){
  let TilesRenderer, GLTFExtensionsPlugin;
  try {
    ({ TilesRenderer } = await import('3d-tiles-renderer'));
    ({ GLTFExtensionsPlugin } = await import('https://esm.sh/3d-tiles-renderer@0.3.38/src/plugins/index.js?external=three'));
  } catch (e){ setStatus('<b>import 失败</b> · '+e.message); }
  if (!TilesRenderer){ return; }

  let url = TILESET;
  let attribution = '';
  if (SOURCE === 'google'){
    if (!GKEY){ setStatus('<b>缺 Google API key</b> · 在 ?key=... 提供（需开 billing）'); }
    url = url || `https://tile.googleapis.com/v1/3dtiles/root.json?key=${GKEY}`;
    attribution = 'Imagery © Google';
  } else { // plateau
    url = url || '../data/plateau/tileset.json';
    attribution = '3D都市モデル PLATEAU · 国土交通省 · CC BY 4.0';
  }
  document.getElementById('attr').textContent = attribution;

  const tiles = new TilesRenderer(url);
  // DRACO decoder for PLATEAU/Google b3dm (compressed glTF) — the last-mile fix
  if (GLTFExtensionsPlugin && tiles.registerPlugin){
    try {
      const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/libs/draco/gltf/');
      tiles.registerPlugin(new GLTFExtensionsPlugin({ dracoLoader: draco }));
    } catch(e){ setStatus('DRACO 插件注册失败: '+e.message); }
  }
  tiles.setCamera(camera); tiles.setResolutionFromRenderer(camera, renderer);
  tiles.addEventListener('load-model', (e) => whitenModel(e.scene || e.model || e));
  scene.add(tiles.group);

  // georeferenced tiles (PLATEAU/Google) live at earth-scale ECEF coords →
  // recenter + reorient the group to world origin and frame the camera once.
  let framed = false;
  tiles.addEventListener('load-tile-set', () => {
    try {
      const sphere = new THREE.Sphere();
      if (!tiles.getBoundingSphere(sphere) || sphere.radius <= 0) return;
      const center = sphere.center.clone();
      const up = center.clone().normalize();                       // local up = earth normal
      const q = new THREE.Quaternion().setFromUnitVectors(up, new THREE.Vector3(0,1,0));
      tiles.group.quaternion.copy(q);
      tiles.group.position.copy(center.applyQuaternion(q)).multiplyScalar(-1);
      const r = sphere.radius;
      camera.near = Math.max(1, r/1000); camera.far = r*40; camera.updateProjectionMatrix();
      camera.position.set(r*0.55, r*0.55, r*0.9);
      controls.target.set(0,0,0); controls.maxDistance = r*6; controls.update();
      framed = true;
      setStatus(`source <b>${SOURCE}</b> · 已对焦 · 半径≈${Math.round(r)}m · 加载白模 tiles…`);
    } catch(e){ setStatus('对焦失败: '+e.message); }
  });
  setStatus(`source <b>${SOURCE}</b> · 加载 tiles…<br><span style="color:var(--soft)">${url.slice(0,60)}</span>`);

  let frames = 0;
  function loop(){
    requestAnimationFrame(loop);
    controls.update(); camera.updateMatrixWorld();
    try { tiles.update(); } catch(e){}
    renderer.render(scene, camera);
    if (++frames === 120 && tiles.group.children.length){
      setStatus(`source <b>${SOURCE}</b> · 已渲染 ${tiles.group.children.length} 组 tile（白材质）`);
    }
  }
  loop();
  window.__tiles = tiles;
}
loadTiles();

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
window.__ready = true;
</script>
</body></html>
