<!doctype html>
<html lang="zh"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PLATEAU 真实白模 · Madori</title>
<style>
  :root{--paper:#efe9df;--ink:#2b2823;--soft:#6b655c;--card:rgba(250,247,241,.82);--line:rgba(70,64,56,.14);
    --serif:"Songti SC",Georgia,serif;--mono:"SF Mono",ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
  #app{position:fixed;inset:0}canvas{display:block}
  .title{position:fixed;top:24px;left:26px;z-index:10;pointer-events:none}
  .title h1{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);margin:0}
  .title .s{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);margin-top:4px}
  .info{position:fixed;left:26px;bottom:24px;z-index:10;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:13px 16px;backdrop-filter:blur(12px);font-family:var(--mono);font-size:11px;color:var(--ink);line-height:1.7;max-width:340px}
  .info b{color:#b34a26}
  .attr{position:fixed;right:14px;bottom:12px;z-index:10;font-family:var(--mono);font-size:10px;color:var(--soft)}
  .hint{position:fixed;right:18px;top:24px;z-index:10;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--soft);opacity:.75}
</style></head>
<body>
<div id="app"></div>
<div class="title"><h1>PLATEAU 真实白模</h1><div class="s" id="src">city-gml footprint extrude · all-local</div></div>
<div class="info" id="info">渲染中…</div>
<div class="attr">3D都市モデル PLATEAU · 国土交通省 · CC BY 4.0</div>
<div class="hint">拖拽旋转 · 滚轮缩放</div>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const BUILDINGS = __BUILDINGS_JSON__;   // [{pts:[[x,z],...], height}]  (metres, local origin)
const META = __META_JSON__;             // {mesh, count, area}

// ---- bounds ----
let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
BUILDINGS.forEach(b=>b.pts.forEach(([x,z])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minZ=Math.min(minZ,z);maxZ=Math.max(maxZ,z);}));
const cx=(minX+maxX)/2, cz=(minZ+maxZ)/2, span=Math.max(maxX-minX,maxZ-minZ,30);

const scene=new THREE.Scene(); scene.background=new THREE.Color(0xefe9df);
scene.fog=new THREE.Fog(0xefe9df, span*1.6, span*5);
const cam=new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.5, span*20);
cam.position.set(cx+span*0.7, span*0.75, cz+span*0.95);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; document.getElementById('app').appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(cam,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.07;
controls.target.set(cx, span*0.04, cz); controls.maxPolarAngle=Math.PI*0.495;

scene.add(new THREE.HemisphereLight(0xffffff,0xddd5c6,.66));
const key=new THREE.DirectionalLight(0xfff4e6,1.05); key.position.set(cx+span,span*1.5,cz-span*0.4);
key.castShadow=true; key.shadow.mapSize.set(2048,2048); const sd=span*0.9;
key.shadow.camera.left=-sd;key.shadow.camera.right=sd;key.shadow.camera.top=sd;key.shadow.camera.bottom=-sd;key.shadow.camera.far=span*6;key.shadow.bias=-0.0003;key.shadow.radius=4;
scene.add(key);
const fill2=new THREE.DirectionalLight(0xeaf0ff,.26); fill2.position.set(cx-span,span*0.7,cz+span); scene.add(fill2);
scene.add(new THREE.AmbientLight(0xffffff,.2));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(span*10,span*10),new THREE.MeshStandardMaterial({color:0xe7e0d4,roughness:.98}));
ground.rotation.x=-Math.PI/2; ground.position.set(cx,-0.02,cz); ground.receiveShadow=true; scene.add(ground);
const grid=new THREE.GridHelper(span*8, Math.round(span*8/10), 0xcfc6b6,0xddd5c7); grid.position.set(cx,0,cz);
grid.material.transparent=true; grid.material.opacity=.16; scene.add(grid);

const wallMat=new THREE.MeshStandardMaterial({color:0xf3efe8,roughness:.88,metalness:0});
let drawn=0;
for(const b of BUILDINGS){
  if(b.pts.length<3) continue;
  const shape=new THREE.Shape();
  b.pts.forEach(([x,z],i)=> i? shape.lineTo(x,z): shape.moveTo(x,z));
  const geo=new THREE.ExtrudeGeometry(shape,{depth:Math.max(b.height,2),bevelEnabled:false,steps:1});
  geo.rotateX(-Math.PI/2);                 // footprint(XY)→ground(XZ), extrude→up(Y)
  const m=new THREE.Mesh(geo,wallMat); m.castShadow=m.receiveShadow=true; scene.add(m); drawn++;
}
document.getElementById('info').innerHTML =
  `<b>${META.mesh||'PLATEAU'}</b> · 真实建筑 <b>${drawn}</b> 栋<br>`+
  `从 CityGML 的 footprint + 高度挤出 · <b>全本地</b>，断网可渲<br>`+
  `<span style="color:var(--soft)">国交省开放数据 · 无 key 无云</span>`;
window.__drawn = drawn;
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,cam);})();
</script></body></html>
