<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paint0_linear" x1="256" y1="256" x2="768" y2="768" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D0F0C0"/>
      <stop offset="100%" stop-color="#ACE1AF"/>
    </linearGradient>
    <linearGradient id="paint1_linear" x1="512" y1="192" x2="512" y2="832" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A2E29" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="225" fill="#2F4F46"/>
  <circle cx="700" cy="300" r="400" fill="white" fill-opacity="0.05"/>
  <circle cx="512" cy="512" r="320" fill="url(#paint0_linear)"/>

  <!-- 保留原有金色内环 -->
  <g stroke="#B8932D" stroke-opacity="0.5" stroke-width="3" fill="none">
    <circle cx="512" cy="512" r="240" stroke-dasharray="12, 20" />
    <circle cx="512" cy="272" r="6" fill="#D4AF37" />
    <circle cx="512" cy="752" r="6" fill="#D4AF37" />
    <circle cx="272" cy="512" r="6" fill="#D4AF37" />
    <circle cx="752" cy="512" r="6" fill="#D4AF37" />
  </g>

  <!-- 替换后的中心花纹外圈 -->
  <g stroke="#557BC1" stroke-width="10" fill="none" stroke-linecap="round">
    <circle cx="512" cy="512" r="176" />
  </g>
  <g stroke="#7A9AD2" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="512" cy="512" r="156" />
  </g>

  <!-- 中心花纹，参考图2 -->
  <g transform="translate(512 512)" filter="url(#softShadow)">
    <g id="petalUnit">
      <path d="M0 -132 C18 -126 46 -94 54 -46 C59 -15 40 12 0 72 C-40 12 -59 -15 -54 -46 C-46 -94 -18 -126 0 -132 Z" fill="#4D6FB5"/>
      <path d="M0 -105 C7 -97 14 -72 15 -43 C15 -15 8 6 0 35 C-8 6 -15 -15 -15 -43 C-14 -72 -7 -97 0 -105 Z" fill="#DDF0D7"/>
    </g>
    <use href="#petalUnit"/>
    <use href="#petalUnit" transform="rotate(45)"/>
    <use href="#petalUnit" transform="rotate(90)"/>
    <use href="#petalUnit" transform="rotate(135)"/>
    <use href="#petalUnit" transform="rotate(180)"/>
    <use href="#petalUnit" transform="rotate(225)"/>
    <use href="#petalUnit" transform="rotate(270)"/>
    <use href="#petalUnit" transform="rotate(315)"/>

    <g id="dropletUnit">
      <path d="M0 -178 C11 -169 16 -156 16 -145 C16 -131 7 -118 0 -110 C-7 -118 -16 -131 -16 -145 C-16 -156 -11 -169 0 -178 Z" fill="#4D6FB5"/>
    </g>
    <use href="#dropletUnit" transform="rotate(22.5)"/>
    <use href="#dropletUnit" transform="rotate(67.5)"/>
    <use href="#dropletUnit" transform="rotate(112.5)"/>
    <use href="#dropletUnit" transform="rotate(157.5)"/>
    <use href="#dropletUnit" transform="rotate(202.5)"/>
    <use href="#dropletUnit" transform="rotate(247.5)"/>
    <use href="#dropletUnit" transform="rotate(292.5)"/>
    <use href="#dropletUnit" transform="rotate(337.5)"/>
  </g>

  <circle cx="512" cy="512" r="320" stroke="url(#paint1_linear)" stroke-width="12" stroke-opacity="0.3"/>
  <circle cx="512" cy="512" r="324" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="316" stroke="#F9E27E" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
